version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: data_engine_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-staging_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d staging_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: