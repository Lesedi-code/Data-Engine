datasets:
  risk_assessment:
    path: "Data/raw/historical_demand.parquet"
    format: "PARQUET"
    validation:
      required_columns: ["product_id", "demand_score", "price"]

  customer_details:
    path: "Data/raw/api_products.json"
    format: "JSON"
    validation:
      required_columns: ["product_id", "category"]