# Target Staging Database (PostgreSQL inside Docker)
targets:
  local_postgres:
    connection_uri: "postgresql://engine_user:engine_password@postgres_db:5432/staging_db"

# Medallion Engine Paths
directories:
  raw: "Data/raw"
  silver: "Data/silver"
  gold: "Data/gold"

# External DB Ingestion Tasks (Empty for local file ingestion)
ingestion: []
    